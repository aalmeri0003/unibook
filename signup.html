<body>
    <header>
    <img src="logo.jpg" alt="UniBook logo" width="120" height="120" usemap="#logo" />

            <area shape="rect" coords="0,0,120,120" href="about.html" alt="Go to About Us" />

    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
        <a href="signup.html">Sign Up</a>
        <a href="about.html">About Us</a>
    </nav>
    <main>
        <h2>Sign Up</h2>
        <form method="post">
            <p>
                <label>
                    <b>First Name:</b>
                    <input type="text" name="fname" size="20" maxlength="25" required />
                </label>
            </p>
            <p>
                <label>
                    <b>Last Name:</b>
                    <input type="text" name="lname" size="20" maxlength="25" required />
                </label>
            </p>
            <p>
                <label>
                    <b>Username:</b>
                    <input type="text" name="Username" size="20" maxlength="25" required />
                </label>
            </p>
            <p>
                <label>
                    <b>Email:</b>
                    <input type="email" name="email" placeholder="name@stu.kau.edu.sa" size="20" maxlength="50"
                        required />
                </label>
            </p>
            <p>
                <label>
                    <b>Password:</b>
                    <input type="password" name="psw" placeholder="At least 8 Characters" size="20" maxlength="25"
                        required />
                </label>
            </p>
            <p>
                <label>
                    <b>Confirm Password:</b>
                    <input type="password" name="cpsw" size="20" maxlength="25" required />
                </label>
            </p>

            <p><b>Choose your faculty:</b></p>

            <label><input type="radio" name="fac" value="computing" />
                Faculty of Computing and Information Technology
            </label> <br/>
            <label><input type="radio" name="fac" value="engineering" />
            Faculty of Engineering
            </label> <br/>
            <label>
            <input type="radio" name="fac" value="business" />

            Faculty of Business
            </label>
            <p>
                <input type="submit" value="Submit" size="10" />
                <input type="reset" value="Clear" size="10" />
            </p>
        </form>

        <p>Already have an account? <a href="login.html">Login</a></p>
    </main>
